[project]
name = "engineering-hub"
version = "0.1.0"
description = "A local personal assistant for engineers — syncs GitHub & Jira, tracks goals, and has an AI assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy==2.0.30",
    "jinja2==3.1.4",
    "python-multipart==0.0.9",
    "httpx==0.27.0",
    "PyGithub==2.9.0",
    "jira==3.10.5",
    "python-dotenv==1.2.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # long lines in prompt strings are intentional

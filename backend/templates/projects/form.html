{% extends "base.html" %}
{% block title %}New Project{% endblock %}
{% block page_title %}New Project{% endblock %}

{% block content %}
<div class="card" style="max-width:560px">
  <form method="post" action="/projects/new"
        hx-post="/projects/new" hx-target="#main-content" hx-swap="innerHTML">
    <div class="form-group">
      <label>Project Name *</label>
      <input type="text" name="name" required autofocus placeholder="e.g. Data Pipeline Refactor" />
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea name="description" placeholder="What is this project about?"></textarea>
    </div>
    <div class="grid grid-2">
      <div class="form-group">
        <label>Status</label>
        <select name="status">
          {% for s in statuses %}
          <option value="{{ s.value }}">{{ s.value|capitalize }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Priority</label>
        <select name="priority">
          {% for p in priorities %}
          <option value="{{ p.value }}" {{ 'selected' if p.value == 'medium' }}>{{ p.value|capitalize }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="flex gap-2">
      <button type="submit" class="btn btn-primary">Create Project</button>
      <a href="/projects/" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
